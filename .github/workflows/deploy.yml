name: Deploy to AWS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Manual trigger
    inputs:
      deploy_environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.5.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Check formatting with black
        run: |
          black --check .
        continue-on-error: true

  deploy:
    name: Deploy to AWS
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    
    permissions:
      id-token: write  # Required for OIDC
      contents: read   # Required for checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Setup
        run: |
          echo "Checking OIDC configuration..."
          echo "Role ARN secret exists: ${{ secrets.AWS_ROLE_ARN != '' }}"
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "❌ ERROR: AWS_ROLE_ARN secret is not set!"
            echo "Please add AWS_ROLE_ARN to GitHub Secrets:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: AWS_ROLE_ARN"
            echo "4. Value: Your IAM Role ARN (e.g., arn:aws:iam::123456789012:role/GitHubActions-DeployRole)"
            exit 1
          fi
          echo "✅ Role ARN is set"
          echo "Repository: ${{ github.repository }}"
          echo "GitHub Actor: ${{ github.actor }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          audience: sts.amazonaws.com
          output-credentials: true

      - name: Verify AWS credentials
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "✅ AWS credentials verified"

      - name: Verify SSH Key Exists
        run: |
          SSH_KEY_NAME="${{ secrets.AWS_SSH_KEY_NAME }}"
          
          if [ -z "$SSH_KEY_NAME" ] || [ "$SSH_KEY_NAME" = "" ]; then
            echo "❌ ERROR: AWS_SSH_KEY_NAME secret is not set in GitHub Secrets!"
            echo ""
            echo "📋 Available key pairs in region ${{ env.AWS_REGION }}:"
            echo "----------------------------------------"
            aws ec2 describe-key-pairs --region ${{ env.AWS_REGION }} --query 'KeyPairs[*].KeyName' --output table 2>&1 || echo "Could not list key pairs (may need permissions)"
            echo ""
            echo "🔧 To fix this:"
            echo "1. Go to GitHub Repository → Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: AWS_SSH_KEY_NAME"
            echo "4. Value: <your-aws-key-pair-name> (from the list above or create a new one)"
            echo ""
            echo "💡 To create a new key pair in AWS:"
            echo "   - AWS Console → EC2 → Key Pairs → Create key pair"
            echo "   - Or use: aws ec2 create-key-pair --key-name my-key --query 'KeyMaterial' --output text > my-key.pem"
            exit 1
          fi
          
          echo "Checking if SSH key pair '$SSH_KEY_NAME' exists in region ${{ env.AWS_REGION }}..."
          if aws ec2 describe-key-pairs --key-names "$SSH_KEY_NAME" --region ${{ env.AWS_REGION }} &>/dev/null; then
            echo "✅ SSH key pair '$SSH_KEY_NAME' exists"
          else
            echo "❌ ERROR: SSH key pair '$SSH_KEY_NAME' does NOT exist in region ${{ env.AWS_REGION }}"
            echo ""
            echo "📋 Available key pairs in this region:"
            aws ec2 describe-key-pairs --region ${{ env.AWS_REGION }} --query 'KeyPairs[*].KeyName' --output table || echo "Could not list key pairs"
            echo ""
            echo "Please either:"
            echo "1. Create the key pair in AWS Console: EC2 → Key Pairs → Create key pair"
            echo "2. Update the AWS_SSH_KEY_NAME secret in GitHub to match an existing key pair name from the list above"
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        id: terraform
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        working-directory: ./infra/terraform
        run: terraform fmt -recursive

      - name: Terraform Format Check
        working-directory: ./infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./infra/terraform
        run: terraform validate

      - name: Create terraform.tfvars
        working-directory: ./infra/terraform
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "${{ env.AWS_REGION }}"
          instance_type = "${{ secrets.AWS_INSTANCE_TYPE || 't3.micro' }}"
          use_spot_instance = true
          spot_price = ""
          ssh_key_name = "${{ secrets.AWS_SSH_KEY_NAME }}"
          EOF

      - name: Import Existing Resources (if they exist)
        working-directory: ./infra/terraform
        continue-on-error: true
        run: |
          echo "🔍 Attempting to import existing resources..."
          
          # Get VPC ID (from default VPC or provided)
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=is-default,Values=true" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "vpc-01194601ab9c678c4")
          echo "📍 Using VPC: $VPC_ID"
          
          # Import Security Group if it exists
          echo ""
          echo "🔐 Checking Security Group..."
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=trading-bot-sg" "Name=vpc-id,Values=${VPC_ID}" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && [ "$SG_ID" != "null" ]; then
            echo "✅ Found Security Group: $SG_ID"
            echo "📥 Importing Security Group..."
            terraform import -var-file=terraform.tfvars aws_security_group.trading_bot "$SG_ID" || echo "⚠️  Security Group import failed (may already be in state)"
          else
            echo "ℹ️  Security Group not found, will be created"
          fi
          
          # Import IAM Role if it exists
          echo ""
          echo "👤 Checking IAM Role..."
          if aws iam get-role --role-name trading-bot-ec2-role &>/dev/null; then
            echo "✅ Found IAM Role: trading-bot-ec2-role"
            echo "📥 Importing IAM Role..."
            terraform import -var-file=terraform.tfvars aws_iam_role.ec2_role trading-bot-ec2-role || echo "⚠️  IAM Role import failed (may already be in state)"
            
            # Import IAM Instance Profile if it exists (depends on IAM Role)
            echo ""
            echo "👤 Checking IAM Instance Profile..."
            if aws iam get-instance-profile --instance-profile-name trading-bot-ec2-profile &>/dev/null; then
              echo "✅ Found IAM Instance Profile: trading-bot-ec2-profile"
              echo "📥 Importing IAM Instance Profile..."
              terraform import -var-file=terraform.tfvars aws_iam_instance_profile.ec2_profile trading-bot-ec2-profile || echo "⚠️  IAM Instance Profile import failed (may already be in state)"
            else
              echo "ℹ️  IAM Instance Profile not found, will be created"
            fi
          else
            echo "ℹ️  IAM Role not found, will be created"
          fi
          
          # Import CloudWatch Log Group if it exists
          echo ""
          echo "📊 Checking CloudWatch Log Group..."
          LOG_GROUP="/aws/ec2/trading-bot"
          if aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query "logGroups[?logGroupName=='${LOG_GROUP}']" --output text 2>/dev/null | grep -q "$LOG_GROUP"; then
            echo "✅ Found CloudWatch Log Group: $LOG_GROUP"
            echo "📥 Importing CloudWatch Log Group..."
            terraform import -var-file=terraform.tfvars aws_cloudwatch_log_group.trading_bot "$LOG_GROUP" || echo "⚠️  CloudWatch Log Group import failed (may already be in state)"
          else
            echo "ℹ️  CloudWatch Log Group not found, will be created"
          fi
          
          echo ""
          echo "📋 Verifying Terraform state..."
          terraform state list || echo "⚠️  Could not list state"
          
          echo ""
          echo "✅ Import step completed"

      - name: Verify Import and Show State
        working-directory: ./infra/terraform
        continue-on-error: true
        run: |
          echo "📋 Current Terraform state:"
          terraform state list || echo "No resources in state yet"
          echo ""
          echo "📊 Checking if resources are in state..."
          if terraform state show aws_security_group.trading_bot &>/dev/null; then
            echo "✅ Security Group is in state"
          else
            echo "⚠️  Security Group NOT in state - will be created"
          fi
          if terraform state show aws_iam_role.ec2_role &>/dev/null; then
            echo "✅ IAM Role is in state"
          else
            echo "⚠️  IAM Role NOT in state - will be created"
          fi
          if terraform state show aws_iam_instance_profile.ec2_profile &>/dev/null; then
            echo "✅ IAM Instance Profile is in state"
          else
            echo "⚠️  IAM Instance Profile NOT in state - will be created"
          fi
          if terraform state show aws_cloudwatch_log_group.trading_bot &>/dev/null; then
            echo "✅ CloudWatch Log Group is in state"
          else
            echo "⚠️  CloudWatch Log Group NOT in state - will be created"
          fi

      - name: Terraform Plan
        working-directory: ./infra/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infra/terraform
        if: github.event_name == 'push' || github.event.inputs.deploy_environment == 'production'
        run: terraform apply -auto-approve tfplan

      - name: Get Instance Info
        working-directory: ./infra/terraform
        id: instance-info
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          INSTANCE_IP=$(terraform output -raw instance_public_ip)
          INSTANCE_DNS=$(terraform output -raw instance_public_dns)
          
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "instance_dns=$INSTANCE_DNS" >> $GITHUB_OUTPUT
          
          echo "Instance ID: $INSTANCE_ID"
          echo "Instance IP: $INSTANCE_IP"
          echo "Instance DNS: $INSTANCE_DNS"
          
          # Verify SSH key is assigned to the instance
          echo ""
          echo "Verifying SSH key is assigned to instance..."
          KEY_NAME=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].KeyName' --output text --region ${{ env.AWS_REGION }})
          
          if [ -z "$KEY_NAME" ] || [ "$KEY_NAME" = "None" ] || [ "$KEY_NAME" = "null" ]; then
            echo "❌ WARNING: No SSH key is assigned to the instance!"
            echo "This may prevent SSH access."
            echo ""
            echo "Instance details:"
            aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].[InstanceId,KeyName,State.Name]' --output table --region ${{ env.AWS_REGION }}
          else
            echo "✅ SSH key '$KEY_NAME' is assigned to instance"
          fi

      - name: Wait for Instance to be Ready
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          INSTANCE_IP: ${{ steps.instance-info.outputs.instance_ip }}
        run: |
          echo "Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "Instance IP: $INSTANCE_IP"
          if [ -z "$INSTANCE_IP" ] || [ "$INSTANCE_IP" = "null" ]; then
            echo "❌ ERROR: Instance IP is not available"
            exit 1
          fi
          
          echo "Waiting for instance to be ready..."
          sleep 60  # Wait for instance to initialize
          
          echo "Testing SSH connection..."
          until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key ec2-user@$INSTANCE_IP 'echo "Instance ready"' 2>&1; do
            echo "Waiting for SSH (attempting connection)..."
            sleep 10
          done
          echo "✅ SSH connection successful!"

      - name: Deploy Application Code
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          INSTANCE_IP: ${{ steps.instance-info.outputs.instance_ip }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Create deployment tarball (ignore "file changed" warnings)
          echo "Creating deployment archive..."
          tar --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.DS_Store' \
              --exclude='*.swp' \
              --exclude='*.swo' \
              --exclude='*.log' \
              --exclude='data' \
              --exclude='models' \
              --exclude='trade_logs' \
              --exclude='backtest_reports' \
              --exclude='htmlcov' \
              --exclude='.pytest_cache' \
              --exclude='.coverage' \
              --exclude='trading-bot.tar.gz' \
              -czf trading-bot.tar.gz . 2>&1 | grep -v "file changed as we read it" || true
          
          echo "Archive created: $(ls -lh trading-bot.tar.gz)"
          
          # Copy to instance
          echo "Copying archive to instance..."
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/deploy_key trading-bot.tar.gz ec2-user@$INSTANCE_IP:/tmp/
          
          # Extract and set up on instance
          echo "Setting up application on instance..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/deploy_key ec2-user@$INSTANCE_IP << 'EOF'
            set -e
            echo "Creating application directory..."
            sudo mkdir -p /opt/trading-bot
            sudo chown ec2-user:ec2-user /opt/trading-bot
            
            cd /opt/trading-bot
            
            echo "Extracting application files..."
            sudo tar -xzf /tmp/trading-bot.tar.gz -C /opt/trading-bot/
            sudo chown -R ec2-user:ec2-user /opt/trading-bot
            
            echo "Installing Python 3.9 if not available..."
            PYTHON39_INSTALLED=false
            
            # Detect package manager
            if command -v dnf &> /dev/null; then
              PKG_MANAGER=dnf
              UPDATE_CMD="sudo dnf update -y"
              INSTALL_CMD="sudo dnf install -y"
            elif command -v yum &> /dev/null; then
              PKG_MANAGER=yum
              UPDATE_CMD="sudo yum update -y"
              INSTALL_CMD="sudo yum install -y"
            else
              echo "ERROR: No supported package manager found"
              exit 1
            fi
            
            if ! command -v python3.9 &> /dev/null; then
              echo "Python 3.9 not found, installing..."
              $UPDATE_CMD
              
              # Check if we're on Amazon Linux 2
              if [ -f /etc/system-release ]; then
                AMAZON_LINUX_VERSION=$(cat /etc/system-release)
                echo "Detected: $AMAZON_LINUX_VERSION"
                
                if echo "$AMAZON_LINUX_VERSION" | grep -q "Amazon Linux 2"; then
                  echo "Attempting Method 1: Amazon Linux Extras..."
                  if sudo amazon-linux-extras enable python3.9 2>/dev/null; then
                    sudo $PKG_MANAGER clean metadata
                    if $INSTALL_CMD python3.9 python3.9-pip python3.9-devel gcc 2>/dev/null; then
                      PYTHON39_INSTALLED=true
                      echo "✅ Python 3.9 installed via Amazon Linux Extras"
                    fi
                  fi
                  
                  if [ "$PYTHON39_INSTALLED" = false ]; then
                    echo "Attempting Method 2: EPEL repository..."
                    if $INSTALL_CMD epel-release 2>/dev/null; then
                      if $INSTALL_CMD python39 python39-pip python39-devel gcc 2>/dev/null; then
                        PYTHON39_INSTALLED=true
                        echo "✅ Python 3.9 installed via EPEL"
                      fi
                    fi
                  fi
                  
                  if [ "$PYTHON39_INSTALLED" = false ] && [ "$PKG_MANAGER" = "yum" ]; then
                    echo "Attempting Method 3: IUS repository..."
                    $INSTALL_CMD https://repo.ius.io/ius-release-el7.rpm 2>/dev/null || true
                    if $INSTALL_CMD python39u python39u-pip python39u-devel gcc 2>/dev/null; then
                      PYTHON39_INSTALLED=true
                      echo "✅ Python 3.9 installed via IUS"
                    fi
                  fi
                  
                  if [ "$PYTHON39_INSTALLED" = false ]; then
                    echo "Attempting Method 4: Installing Python 3.9 from source (this may take 5-10 minutes)..."
                    if [ "$PKG_MANAGER" = "dnf" ]; then
                      $INSTALL_CMD "Development Tools" 2>/dev/null || true
                    else
                      sudo yum groupinstall -y "Development Tools" 2>/dev/null || true
                    fi
                    $INSTALL_CMD openssl-devel bzip2-devel libffi-devel zlib-devel readline-devel sqlite-devel wget 2>/dev/null || true
                    
                    cd /tmp
                    if [ ! -f Python-3.9.18.tgz ]; then
                      wget -q https://www.python.org/ftp/python/3.9.18/Python-3.9.18.tgz
                    fi
                    if [ -f Python-3.9.18.tgz ]; then
                      tar xzf Python-3.9.18.tgz
                      cd Python-3.9.18
                      ./configure --prefix=/usr/local --enable-optimizations --with-ensurepip=install 2>&1 | tail -20
                      make -j$(nproc) 2>&1 | tail -20
                      sudo make altinstall 2>&1 | tail -20
                      cd /opt/trading-bot
                      if command -v /usr/local/bin/python3.9 &> /dev/null; then
                        PYTHON39_INSTALLED=true
                        echo "✅ Python 3.9 installed from source"
                      fi
                    fi
                  fi
                else
                  # For Amazon Linux 2023 or other versions
                  echo "Installing Python 3.9 from default repositories..."
                  # Amazon Linux 2023 should have Python 3.9+ by default, but might be named python3
                  if $INSTALL_CMD python3.9 python3.9-pip python3.9-devel gcc 2>/dev/null; then
                    PYTHON39_INSTALLED=true
                  elif $INSTALL_CMD python39 python39-pip python39-devel gcc 2>/dev/null; then
                    PYTHON39_INSTALLED=true
                  elif $INSTALL_CMD python3 python3-pip python3-devel gcc 2>/dev/null; then
                    # Check if python3 is 3.9+
                    PYTHON3_VERSION=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" 2>/dev/null || echo "0.0")
                    PYTHON3_MAJOR=$(echo $PYTHON3_VERSION | cut -d. -f1)
                    PYTHON3_MINOR=$(echo $PYTHON3_VERSION | cut -d. -f2)
                    if [ "$PYTHON3_MAJOR" -eq 3 ] && [ "$PYTHON3_MINOR" -ge 9 ]; then
                      # Create symlink python3.9 -> python3
                      sudo ln -sf $(which python3) /usr/local/bin/python3.9 2>/dev/null || true
                      PYTHON39_INSTALLED=true
                      echo "✅ Python 3.9+ found as python3, creating symlink"
                    fi
                  fi
                fi
              fi
              
              if [ "$PYTHON39_INSTALLED" = false ]; then
                echo "❌ ERROR: Could not install Python 3.9 using any method"
                echo "Please consider updating the AMI to Amazon Linux 2023 which has Python 3.9+ by default"
                exit 1
              fi
            else
              PYTHON39_INSTALLED=true
              echo "✅ Python 3.9 already installed"
            fi
            
            echo "Checking Python version..."
            # Try multiple possible locations for Python 3.9
            if command -v python3.9 &> /dev/null; then
              PYTHON_CMD=python3.9
            elif command -v /usr/bin/python3.9 &> /dev/null; then
              PYTHON_CMD=/usr/bin/python3.9
            elif command -v /usr/local/bin/python3.9 &> /dev/null; then
              PYTHON_CMD=/usr/local/bin/python3.9
            else
              PYTHON_CMD=$(which python3 || echo "python3")
            fi
            
            PYTHON_VERSION=$($PYTHON_CMD --version 2>&1 || echo "unknown")
            echo "Using Python: $PYTHON_CMD ($PYTHON_VERSION)"
            
            # Verify Python version is 3.8 or higher
            PYTHON_MAJOR=$($PYTHON_CMD -c "import sys; print(sys.version_info.major)" 2>/dev/null || echo "0")
            PYTHON_MINOR=$($PYTHON_CMD -c "import sys; print(sys.version_info.minor)" 2>/dev/null || echo "0")
            
            if [ "$PYTHON_MAJOR" -lt 3 ] || ([ "$PYTHON_MAJOR" -eq 3 ] && [ "$PYTHON_MINOR" -lt 8 ]); then
              echo "❌ ERROR: Python version is $PYTHON_MAJOR.$PYTHON_MINOR, but pandas>=2.0.0 requires Python 3.8+"
              echo "Please ensure Python 3.9 is installed in user_data.sh or update the AMI to Amazon Linux 2023"
              exit 1
            fi
            
            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              echo "Creating virtual environment with $PYTHON_CMD..."
              $PYTHON_CMD -m venv venv || {
                echo "Failed to create venv with $PYTHON_CMD, trying python3..."
                python3 -m venv venv
              }
            fi
            
            echo "Activating virtual environment and installing dependencies..."
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            echo "Creating .env file..."
            cat > .env <<ENVEOF
          DELTA_API_KEY=${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET=${{ secrets.DELTA_API_SECRET }}
          DELTA_BASE_URL=https://api.india.delta.exchange
          DELTA_TESTNET=false
          TRADING_PRODUCTS=${{ secrets.TRADING_PRODUCTS || 'BTCUSD,ETHUSD' }}
          MAX_POSITION_SIZE=${{ secrets.MAX_POSITION_SIZE || '1000.0' }}
          MAX_LEVERAGE=${{ secrets.MAX_LEVERAGE || '10' }}
          RISK_PER_TRADE=${{ secrets.RISK_PER_TRADE || '0.02' }}
          DEFAULT_TIMEFRAME=${{ secrets.DEFAULT_TIMEFRAME || '1h' }}
          ML_MODEL_PATH=models
          ML_RETRAIN_INTERVAL_HOURS=24
          ML_FEATURE_WINDOW=100
          ML_PREDICTION_THRESHOLD=0.6
          DATA_DIR=data
          LOG_LEVEL=INFO
          ENVEOF
            
            echo "Setting up systemd service..."
            sudo tee /etc/systemd/system/trading-bot.service > /dev/null <<SERVICEEOF
          [Unit]
          Description=Trading Bot Service
          After=network.target
          
          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/trading-bot
          Environment="PATH=/opt/trading-bot/venv/bin"
          ExecStart=/opt/trading-bot/venv/bin/python main.py
          Restart=always
          RestartSec=10
          
          [Install]
          WantedBy=multi-user.target
          SERVICEEOF
            
            echo "Enabling and starting service..."
            sudo systemctl daemon-reload
            sudo systemctl enable trading-bot || true
            sudo systemctl restart trading-bot || echo "Service may not exist yet, will start on next boot"
            
            echo "Checking service status..."
            sudo systemctl status trading-bot --no-pager || echo "Service status check completed"
          EOF
          
          echo "✅ Deployment completed!"

      - name: Verify Deployment
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ec2-user@${{ steps.instance-info.outputs.instance_ip }} << 'EOF'
            sudo systemctl status trading-bot
            sleep 5
            sudo journalctl -u trading-bot -n 20 --no-pager
          EOF

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Instance ID:** ${{ steps.instance-info.outputs.instance_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Public IP:** ${{ steps.instance-info.outputs.instance_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**Public DNS:** ${{ steps.instance-info.outputs.instance_dns }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SSH Connection" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "ssh -i ~/.ssh/your-key.pem ec2-user@${{ steps.instance-info.outputs.instance_ip }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### View Logs" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "ssh -i ~/.ssh/your-key.pem ec2-user@${{ steps.instance-info.outputs.instance_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "sudo journalctl -u trading-bot -f" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Deploy to Staging
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_environment == 'staging'
    
    permissions:
      id-token: write  # Required for OIDC
      contents: read   # Required for checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Setup
        run: |
          echo "Checking OIDC configuration..."
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "❌ ERROR: AWS_ROLE_ARN secret is not set!"
            exit 1
          fi
          echo "✅ Role ARN is set"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Staging-${{ github.run_id }}
          audience: sts.amazonaws.com
          output-credentials: true

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Verify SSH Key Exists (Staging)
        run: |
          SSH_KEY_NAME="${{ secrets.AWS_SSH_KEY_NAME }}"
          
          if [ -z "$SSH_KEY_NAME" ] || [ "$SSH_KEY_NAME" = "" ]; then
            echo "❌ ERROR: AWS_SSH_KEY_NAME secret is not set in GitHub Secrets!"
            echo ""
            echo "📋 Available key pairs in region ${{ env.AWS_REGION }}:"
            echo "----------------------------------------"
            aws ec2 describe-key-pairs --region ${{ env.AWS_REGION }} --query 'KeyPairs[*].KeyName' --output table 2>&1 || echo "Could not list key pairs (may need permissions)"
            echo ""
            echo "🔧 To fix this:"
            echo "1. Go to GitHub Repository → Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: AWS_SSH_KEY_NAME"
            echo "4. Value: <your-aws-key-pair-name> (from the list above or create a new one)"
            exit 1
          fi
          
          echo "Checking if SSH key pair '$SSH_KEY_NAME' exists in region ${{ env.AWS_REGION }}..."
          if aws ec2 describe-key-pairs --key-names "$SSH_KEY_NAME" --region ${{ env.AWS_REGION }} &>/dev/null; then
            echo "✅ SSH key pair '$SSH_KEY_NAME' exists"
          else
            echo "❌ ERROR: SSH key pair '$SSH_KEY_NAME' does NOT exist in region ${{ env.AWS_REGION }}"
            echo ""
            echo "📋 Available key pairs in this region:"
            aws ec2 describe-key-pairs --region ${{ env.AWS_REGION }} --query 'KeyPairs[*].KeyName' --output table || echo "Could not list key pairs"
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        id: terraform
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init

      - name: Create terraform.tfvars for staging
        working-directory: ./infra/terraform
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "${{ env.AWS_REGION }}"
          instance_type = "t3.micro"
          use_spot_instance = true
          spot_price = ""
          ssh_key_name = "${{ secrets.AWS_SSH_KEY_NAME }}"
          EOF

      - name: Import Existing Resources (if they exist) - Staging
        working-directory: ./infra/terraform
        continue-on-error: true
        run: |
          echo "🔍 Attempting to import existing resources..."
          
          # Get VPC ID (from default VPC or provided)
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=is-default,Values=true" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "vpc-01194601ab9c678c4")
          echo "📍 Using VPC: $VPC_ID"
          
          # Import Security Group if it exists
          echo ""
          echo "🔐 Checking Security Group..."
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=trading-bot-sg" "Name=vpc-id,Values=${VPC_ID}" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && [ "$SG_ID" != "null" ]; then
            echo "✅ Found Security Group: $SG_ID"
            echo "📥 Importing Security Group..."
            terraform import -var-file=terraform.tfvars aws_security_group.trading_bot "$SG_ID" || echo "⚠️  Security Group import failed (may already be in state)"
          else
            echo "ℹ️  Security Group not found, will be created"
          fi
          
          # Import IAM Role if it exists
          echo ""
          echo "👤 Checking IAM Role..."
          if aws iam get-role --role-name trading-bot-ec2-role &>/dev/null; then
            echo "✅ Found IAM Role: trading-bot-ec2-role"
            echo "📥 Importing IAM Role..."
            terraform import -var-file=terraform.tfvars aws_iam_role.ec2_role trading-bot-ec2-role || echo "⚠️  IAM Role import failed (may already be in state)"
            
            # Import IAM Instance Profile if it exists (depends on IAM Role)
            echo ""
            echo "👤 Checking IAM Instance Profile..."
            if aws iam get-instance-profile --instance-profile-name trading-bot-ec2-profile &>/dev/null; then
              echo "✅ Found IAM Instance Profile: trading-bot-ec2-profile"
              echo "📥 Importing IAM Instance Profile..."
              terraform import -var-file=terraform.tfvars aws_iam_instance_profile.ec2_profile trading-bot-ec2-profile || echo "⚠️  IAM Instance Profile import failed (may already be in state)"
            else
              echo "ℹ️  IAM Instance Profile not found, will be created"
            fi
          else
            echo "ℹ️  IAM Role not found, will be created"
          fi
          
          # Import CloudWatch Log Group if it exists
          echo ""
          echo "📊 Checking CloudWatch Log Group..."
          LOG_GROUP="/aws/ec2/trading-bot"
          if aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query "logGroups[?logGroupName=='${LOG_GROUP}']" --output text 2>/dev/null | grep -q "$LOG_GROUP"; then
            echo "✅ Found CloudWatch Log Group: $LOG_GROUP"
            echo "📥 Importing CloudWatch Log Group..."
            terraform import -var-file=terraform.tfvars aws_cloudwatch_log_group.trading_bot "$LOG_GROUP" || echo "⚠️  CloudWatch Log Group import failed (may already be in state)"
          else
            echo "ℹ️  CloudWatch Log Group not found, will be created"
          fi

      - name: Terraform Plan (Staging)
        working-directory: ./infra/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply (Staging)
        working-directory: ./infra/terraform
        run: terraform apply -auto-approve tfplan

